# source: rules/sigma/ot/ot_dnp3_restart_command.yml
groups:
- name: ot_dnp3_restart_command
  rules:
  - alert: DNP3_Cold_Or_Warm_Restart_Command
    annotations:
      author: Liam Carvajal
      description: 'Detects a DNP3 Cold Restart or Warm Restart function. Both disrupt
        an

        outstation: a cold restart reinitializes the device, while a warm restart

        restarts the application. Outside a maintenance window this is a strong

        indicator of an attempt to disrupt control or to force a device into a

        recoverable state.

        '
      summary: DNP3 Cold Or Warm Restart Command
    expr: sum(count_over_time({job=~".+"} | logfmt | direction=~`(?i)^request$` and
      (function_code=13 or function_code=14) | line_format "{{.link_source}} {{.link_destination}}
      {{.function_name}}" [1m])) or vector(0) > 0
    labels:
      severity: high

