# source: rules/sigma/ot/ot_s7comm_program_download.yml
groups:
- name: Sigma rules
  rules:
  - alert: S7comm_Program_Download
    annotations:
      author: Liam Carvajal
      description: 'Detects a program block download to a Siemens controller (Request
        Download,

        Download Block, Download Ended). Downloading logic to a controller is how
        an

        attacker persists on the PLC and modifies process behaviour; outside an

        engineering change window it is high severity.


        Operates on decoded S7comm events (see docs/TELEMETRY.md) produced by

        tools/s7comm-dpi.

        '
      summary: S7comm Program Download
    expr: sum(count_over_time({job=~".+"} | logfmt | direction=~`(?i)^request$` and
      (function_code=26 or function_code=27 or function_code=28) | line_format "{{.function_name}}
      {{.pdu_reference}} {{.parameter_length}}" [1m])) or vector(0) > 0
    labels:
      severity: high

