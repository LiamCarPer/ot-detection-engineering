# source: rules/sigma/ot/ot_detection_service_down.yml
groups:
- name: ot_detection_service_down
  rules:
  - alert: Detection_Service_Stopped
    annotations:
      author: Liam Carvajal
      description: 'Detects a detection producer that has stopped running. A sensor
        that dies,

        from a crash or from an adversary stopping it, leaves the plant blind without

        any event on the wire. The watchdog checks every producer process and emits

        this event so the loss of visibility is itself detected (Inhibit Response

        Function).


        This is the counterpart to "monitor the monitors": the absence of an expected

        heartbeat is the signal. The producer name is carried in `producer`.

        '
      summary: Detection Service Stopped
    expr: sum(count_over_time({job=~".+", service="watchdog"} | logfmt | event_type=~`(?i)^detection_service_down$`
      | line_format "{{.producer}} {{.severity}} {{.description}}" [1m])) or vector(0)
      > 0
    labels:
      severity: critical
