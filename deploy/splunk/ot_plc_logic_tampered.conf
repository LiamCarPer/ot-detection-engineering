# source: rules/sigma/ot/ot_plc_logic_tampered.yml

[default]
dispatch.earliest_time = -30d
dispatch.latest_time = now

[PLC Logic Integrity Verification Failed]
description = Detects a deployed PLC program whose hash no longer matches the golden \
manifest. A logic change can survive a reboot, bypass an interlock and leave \
no network event at the next poll; the program hash is the integrity signal.
search = event_type="logic_tampered" \
| table plc,status,description
