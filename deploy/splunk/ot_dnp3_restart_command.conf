# source: rules/sigma/ot/ot_dnp3_restart_command.yml

[default]
dispatch.earliest_time = -30d
dispatch.latest_time = now

[DNP3 Cold Or Warm Restart Command]
description = Detects a DNP3 Cold Restart or Warm Restart function. Both disrupt an \
outstation: a cold restart reinitializes the device, while a warm restart \
restarts the application. Outside a maintenance window this is a strong \
indicator of an attempt to disrupt control or to force a device into a \
recoverable state.
search = direction="request" function_code IN (13, 14) \
| table link_source,link_destination,function_name
