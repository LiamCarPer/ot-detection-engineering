# source: rules/sigma/ot/ot_flow_industrial_service_refused.yml

[default]
dispatch.earliest_time = -30d
dispatch.latest_time = now

[Connection Refused Or Reset To An Industrial Service]
description = Detects a flow to an industrial service that was refused or reset rather than \
established. Repeated refusals or resets against a controller, outstation or \
OPC UA server are how a denial-of-control attempt looks from the network: the \
service is reachable but unable to accept work, or the peer is tearing down \
every connection. \
 \
A single reset is routine. The rule exists so the flow layer records the \
event; escalation should depend on volume or on correlation with a process \
signal.
search = flow_state IN ("REJ", "S0", "RSTO", "RSTR") dst_port IN (102, 502, 4840, 20000) \
| table src_ip,dst_ip,dst_port,flow_state
