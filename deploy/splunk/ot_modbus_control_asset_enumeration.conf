# source: rules/sigma/ot/ot_modbus_control_asset_enumeration.yml

[default]
dispatch.earliest_time = -30d
dispatch.latest_time = now

[Modbus Control Asset Enumeration]
description = Detects one host reading process data from several distinct control assets \
inside a short window. \
 \
A supervisory host polling a single PLC is normal on an OT network. One host \
touching several control assets it has no operational reason to touch is \
consistent with discovery before an operation, and it is the step the committed \
NDR evidence shows four minutes before an unauthorised setpoint write. \
 \
This is a correlation rule, not a signature. It counts the distinct \
destinations among the events the referenced rule matches, per source, inside \
a five-minute window. The distinction matters: a first-order rule that counts \
reads cannot tell a polling master from an enumerator, because normal polling \
produces more matches than enumeration does. Only the distinct-destination \
count separates them. \
 \
T0846 is asserted because the behaviour enumerates the control assets; T0888 is \
asserted because it reads their process state. Both are true of the same \
traffic, and a defender responding to either framing takes the same first step.
search =  \
[Modbus Process State Read From Unauthorized Source] \
description = Detects a Modbus read of process data (holding or input registers) from a host \ \
that is not an approved operator interface. In a segmented OT network, process \ \
reads should originate only from the HMI or the supervisory collector; a read \ \
from any other source is reconnaissance or a compromised host mapping the \ \
process before acting on it. \ \
 \ \
This rule operates on normalized NDR telemetry (see docs/TELEMETRY.md). The \ \
approved readers are site-specific and must be tuned per environment. \
search = direction="request" function_code IN (3, 4) NOT (src_ip IN ("172.21.0.20", "172.22.0.10")) \ \
| table src_ip,dst_ip,function_code,register \
 \
| bin _time span=5m \
| stats dc(dst_ip) as value_count by _time src_ip \
 \
| search value_count >= 3
