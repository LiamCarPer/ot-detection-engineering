# source: rules/sigma/ot/ot_modbus_device_identification_scan.yml

[default]
dispatch.earliest_time = -30d
dispatch.latest_time = now

[Modbus Device Identification Scan]
description = Detects Modbus device identification requests (function code 43, Read Device \
Identification, and function code 17, Report Server ID) sent as requests. \
These functions enumerate vendor, product and firmware information and are a \
common first step in OT reconnaissance, mapping devices before an attack. \
 \
Device identification is rare in steady-state polling, which makes it a \
high-signal event even at low volume.
search = direction="request" function_code IN (17, 43) \
| table src_ip,dst_ip,function_code,unit_id
