# source: rules/sigma/ot/ot_dnp3_unauthorized_control.yml

[default]
dispatch.earliest_time = -30d
dispatch.latest_time = now

[DNP3 Control Operation From Unauthorized Master]
description = Detects a DNP3 control operation (Select, Operate, Direct Operate or Direct \
Operate No Ack) issued by a master that is not an approved control master. \
DNP3 control functions change physical outputs, so a control operation from an \
unexpected link address is either a compromised host or an unauthorized \
engineering change. \
 \
The rule operates on decoded DNP3 events (see docs/TELEMETRY.md) produced by \
tools/dnp3-dpi. Authorized master link addresses are site-specific.
search = direction="request" function_code IN (3, 4, 5, 6) NOT (link_source IN (1, 2)) \
| table link_source,link_destination,function_name,object_group,control_code
