# source: rules/sigma/ot/ot_hmi_login_failure.yml

[default]
dispatch.earliest_time = -30d
dispatch.latest_time = now

[HMI Login Failure]
description = Detects a failed HMI login at the DMZ reverse proxy. A single failure is \
routine; the constituent event exists so a burst can be correlated by source \
without relying on the proxy's own threshold.
search = event_type="login_failure" \
| table src_ip,request,status
