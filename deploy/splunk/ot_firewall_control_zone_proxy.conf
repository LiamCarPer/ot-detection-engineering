# source: rules/sigma/ot/ot_firewall_control_zone_proxy.yml

[default]
dispatch.earliest_time = -30d
dispatch.latest_time = now

[Control Zone Host Reaching Multiple Enterprise Destinations]
description = Detects one control-zone host opening accepted connections to several distinct \
enterprise destinations inside a short window. A single egress flow is covered \
by the first-order rule; a fan-out to many destinations is the shape of a host \
being used as a proxy out of the plant, relaying command and control through \
the enterprise network instead of talking to the internet directly. \
 \
The correlation references the control-zone egress rule, so it only counts \
flows that the firewall accepted over DNS, HTTP or HTTPS. That keeps routine \
denied traffic out of the count.
search =  \
[Control Zone Egress To The Enterprise Over A Standard Port] \
description = Detects a control-zone host opening an accepted connection to the enterprise \ \
zone on a standard application port (DNS, HTTP or HTTPS). Purdue segmentation \ \
allows no direct control-to-enterprise path, so an accepted flow is either a \ \
policy gap or a compromised controller using a standard protocol to blend in \ \
with enterprise traffic, both as command and control and as a proxy. \ \
 \ \
The zone labels come from the gateway's interface-to-zone mapping and the raw \ \
iptables decision is normalized into the ot_firewall contract (see \ \
docs/TELEMETRY.md). \
search = action="ACCEPT" src_zone="control" dst_zone="it" dst_port IN (53, 80, 443) \ \
| table src_ip,dst_ip,dst_port,proto \
 \
| bin _time span=10m \
| stats dc(dst_ip) as value_count by _time src_ip \
 \
| search value_count >= 3
