# source: rules/sigma/ot/ot_s7comm_program_upload.yml

[default]
dispatch.earliest_time = -30d
dispatch.latest_time = now

[S7comm Program Upload]
description = Detects a program block upload from a Siemens controller (Start Upload, \
Upload, End Upload). Reading logic out of a controller is how an attacker \
learns the process and prepares a targeted modification; it is also how the \
PLC program is exfiltrated. \
 \
Operates on decoded S7comm events (see docs/TELEMETRY.md) produced by \
tools/s7comm-dpi.
search = direction="request" function_code IN (29, 30, 31) \
| table function_name,pdu_reference
