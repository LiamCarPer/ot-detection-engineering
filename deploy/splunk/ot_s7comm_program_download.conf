# source: rules/sigma/ot/ot_s7comm_program_download.yml

[default]
dispatch.earliest_time = -30d
dispatch.latest_time = now

[S7comm Program Download]
description = Detects a program block download to a Siemens controller (Request Download, \
Download Block, Download Ended). Downloading logic to a controller is how an \
attacker persists on the PLC and modifies process behaviour; outside an \
engineering change window it is high severity. \
 \
Operates on decoded S7comm events (see docs/TELEMETRY.md) produced by \
tools/s7comm-dpi.
search = direction="request" function_code IN (26, 27, 28) \
| table function_name,pdu_reference,parameter_length
