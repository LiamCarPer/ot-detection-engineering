# source: rules/sigma/ot/ot_opcua_browse_request.yml

[default]
dispatch.earliest_time = -30d
dispatch.latest_time = now

[OPC UA Address Space Browse]
description = Detects an OPC UA Browse or BrowseNext request. Browsing walks the address \
space to enumerate nodes, which is how an attacker discovers the tags and \
structures of a controller before acting on them. \
 \
Operates on decoded OPC UA events (see docs/TELEMETRY.md) produced by \
tools/opcua-dpi. Only plaintext (None/Sign) channels expose the service, so \
this rule does not see SignAndEncrypt traffic.
search = direction="request" opcua_service IN ("BrowseRequest", "BrowseNextRequest") \
| table secure_channel_id,request_id
