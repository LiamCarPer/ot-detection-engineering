# source: rules/sigma/ot/ot_modbus_register_enumeration.yml

[default]
dispatch.earliest_time = -30d
dispatch.latest_time = now

[Modbus Register Enumeration From One Host]
description = Detects one host reading many distinct Modbus registers inside a short window. \
Reading a few registers is polling; walking a large slice of the register map \
is automated collection, harvesting process values before an operation or for \
intelligence. \
 \
The correlation references the unauthorized process-read rule, so an approved \
operator interface is filtered out. A host on the allowlist that has been \
compromised would need a separate allowlist entry removed, which is a \
deliberate change rather than a silent gap.
search = direction="request" function_code IN (3, 4) src_ip=* NOT src_ip="172.22.0.10" | table src_ip,dst_ip,function_code,register \
 \
| bin _time span=5m \
| stats dc(register) as value_count by _time src_ip \
 \
| search value_count >= 20
