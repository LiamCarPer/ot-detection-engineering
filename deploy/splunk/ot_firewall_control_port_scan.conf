# source: rules/sigma/ot/ot_firewall_control_port_scan.yml

[default]
dispatch.earliest_time = -30d
dispatch.latest_time = now

[Enterprise Host Probing Multiple Control Zone Ports]
description = Detects one enterprise host whose traffic to the control zone is dropped across \
several distinct destination ports inside a short window. A single drop is a \
policy violation covered by the first-order rule; a sweep of many ports is \
connection enumeration, mapping which controller services are reachable before \
choosing a target. \
 \
The correlation references the cross-zone drop rule, so ICMP health checks and \
accepted flows are filtered out before the port count is taken.
search =  \
[Industrial Protocol Traffic From Enterprise To Control Zone] \
description = Detects the zone firewall dropping industrial protocol traffic that \ \
originates in the enterprise zone and targets the control zone. A healthy \ \
Purdue segmentation allows no direct path from Level 4/5 to Level 1; traffic \ \
that reaches the firewall boundary is evidence of a misconfigured asset, a \ \
misrouted pivot, or an attempt to reach controllers directly. \ \
 \ \
The firewall allows the enterprise zone to reach only the industrial DMZ and \ \
the operations zone, so every drop of this shape is a policy violation rather \ \
than routine noise. \
search = action="DROP" src_zone="it" dst_zone="control" NOT proto="ICMP" \ \
| table src_ip,dst_ip,dst_port,proto \
 \
| bin _time span=5m \
| stats dc(dst_port) as value_count by _time src_ip \
 \
| search value_count >= 6
