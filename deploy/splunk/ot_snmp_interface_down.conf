# source: rules/sigma/ot/ot_snmp_interface_down.yml

[default]
dispatch.earliest_time = -30d
dispatch.latest_time = now

[Network Interface Down On An OT Device]
description = Detects an SNMP linkDown trap from an OT device. A single interface going \
down is routine; a controller or a switch port carrying control traffic going \
down is a loss of view or a precursor to loss of control, and is worth \
correlating with the process state. \
 \
Operates on the normalized SNMP contract (docs/TELEMETRY.md): traps exported \
from snmptrapd or a poller, mapped to one event per trap.
search = event_type="interface_down" \
| table device,oid,snmp_value
