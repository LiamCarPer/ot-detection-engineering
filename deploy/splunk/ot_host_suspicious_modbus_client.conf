# source: rules/sigma/ot/ot_host_suspicious_modbus_client.yml

[default]
dispatch.earliest_time = -30d
dispatch.latest_time = now

[Suspicious Modbus Client Initiated From An Endpoint]
description = Detects an endpoint process initiating an outbound Modbus/TCP connection with \
a tool name associated with arbitrary register access. A legitimate HMI or \
historian process has a stable image name and a known install path; a \
download-directory binary opening 502 is a compromised workstation or an \
unauthorized tool.
search = event_id=3 initiated="true" dst_port=502 image IN ("*\\poll_plc.exe", "*\\modbus_scan.exe", "*\\memdump.exe") \
| table hostname,user,image,dst_ip,dst_port
