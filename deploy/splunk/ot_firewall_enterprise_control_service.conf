# source: rules/sigma/ot/ot_firewall_enterprise_control_service.yml

[default]
dispatch.earliest_time = -30d
dispatch.latest_time = now

[Enterprise Host Permitted To Reach A Control Zone Service]
description = Detects the zone firewall accepting a connection from the enterprise zone to a \
control-zone industrial service port. Purdue segmentation allows no direct path \
from Level 4/5 to Level 1, so an accepted flow is a policy gap that lets an \
enterprise host reach a controller, outstation or OPC UA server directly and \
attempt to exploit the service instead of pivoting through the DMZ. \
 \
The complementary rule detects the drop of the same traffic; this one fires \
when the path is allowed, which is the case worth fixing.
search = action="ACCEPT" src_zone="it" dst_zone="control" dst_port IN (102, 502, 4840, 20000) \
| table src_ip,dst_ip,dst_port,proto
