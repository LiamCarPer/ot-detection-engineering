# source: rules/sigma/ot/ot_opcua_node_enumeration.yml

[default]
dispatch.earliest_time = -30d
dispatch.latest_time = now

[OPC UA Address Space Enumeration]
description = Detects one OPC UA session issuing many browse requests inside a short window. \
A client browses once when it populates its address space view; a sustained \
browse is point-and-tag identification, walking the node tree to enumerate the \
process before acting on it. \
 \
The correlation references the browse rule and groups by secure channel, which \
is the session identity the decoder exposes. A client that reconnects for every \
request would fall below the per-session count; pair the rule with the first- \
order browse alert for that case.
search =  \
[OPC UA Address Space Browse] \
description = Detects an OPC UA Browse or BrowseNext request. Browsing walks the address \ \
space to enumerate nodes, which is how an attacker discovers the tags and \ \
structures of a controller before acting on them. \ \
 \ \
Operates on decoded OPC UA events (see docs/TELEMETRY.md) produced by \ \
tools/opcua-dpi. Only plaintext (None/Sign) channels expose the service, so \ \
this rule does not see SignAndEncrypt traffic. \
search = direction="request" opcua_service IN ("BrowseRequest", "BrowseNextRequest") \ \
| table secure_channel_id,request_id \
 \
| bin _time span=5m \
| stats count as event_count by _time secure_channel_id \
 \
| search event_count >= 20
