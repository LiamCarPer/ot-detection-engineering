# source: rules/sigma/ot/ot_opcua_node_enumeration.yml

[default]
dispatch.earliest_time = -30d
dispatch.latest_time = now

[OPC UA Address Space Enumeration]
description = Detects one OPC UA session issuing many browse requests inside a short window. \
A client browses once when it populates its address space view; a sustained \
browse is point-and-tag identification, walking the node tree to enumerate the \
process before acting on it. \
 \
The correlation references the browse rule and groups by source host. A client \
that browses once on connect stays below the count; a host that walks a large \
node tree across reconnects still aggregates. The first-order browse rule is \
scoped to clients outside the approved OPC UA allowlist, so an authorized HMI \
browsing on connect does not contribute.
search = direction="request" opcua_service IN ("BrowseRequest", "BrowseNextRequest") src_ip=* NOT (src_ip IN ("172.22.0.10", "172.23.0.4")) | table src_ip,secure_channel_id,request_id \
 \
| bin _time span=5m \
| stats count as event_count by _time src_ip \
 \
| search event_count >= 20
