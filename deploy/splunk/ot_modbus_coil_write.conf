# source: rules/sigma/ot/ot_modbus_coil_write.yml

[default]
dispatch.earliest_time = -30d
dispatch.latest_time = now

[Modbus Coil Write From Unauthorized Control Writer]
description = Detects a Modbus coil write (FC5 Write Single Coil or FC15 Write Multiple \
Coils) from a host that is not an approved control writer. Coils are the \
discrete outputs that start pumps, open valves and drive contactors; the \
holding-register rules do not see them. A coil write from an unexpected host \
is a direct physical command, not a setpoint change. \
 \
This rule operates on normalized NDR telemetry (see docs/TELEMETRY.md). The \
approved writers are site-specific and must be tuned per environment.
search = direction="request" function_code IN (5, 15) src_ip=* NOT src_ip="172.22.0.10" \
| table src_ip,dst_ip,function_code,register,quantity,coils
