# source: rules/sigma/ot/ot_modbus_exception_flood.yml

[default]
dispatch.earliest_time = -30d
dispatch.latest_time = now

[Modbus Exception Flood Toward An Operator Interface]
description = Detects a sustained stream of Modbus exception responses toward one operator \
interface. The controller is answering, but rejecting every request, so the HMI \
cannot read the process state it renders. That is denial of view from the \
network layer: the operator loses visibility without the controller going \
offline. \
 \
The correlation references the exception-response rule and groups by the \
destination, so a single misbehaving client does not aggregate with exceptions \
aimed at other HMIs.
search =  \
[Modbus Exception Response] \
description = Detects a Modbus exception response: the controller answered, but rejected the \ \
request. One exception is a normal response to an invalid or unsupported \ \
request; a sustained stream of exceptions toward an operator interface is a \ \
denial-of-view signal, because the HMI can no longer read the process state it \ \
renders. \ \
 \ \
This is the constituent signal for the exception-flood correlation. It is \ \
deliberately low severity on its own. \
search = direction="response" exception_code=* \ \
| table src_ip,dst_ip,function_code,exception_code \
 \
| bin _time span=5m \
| stats count as event_count by _time dst_ip \
 \
| search event_count >= 10
