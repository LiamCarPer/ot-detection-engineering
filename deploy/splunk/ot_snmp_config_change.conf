# source: rules/sigma/ot/ot_snmp_config_change.yml

[default]
dispatch.earliest_time = -30d
dispatch.latest_time = now

[OT Device Configuration Change]
description = Detects an SNMP notification that a device's running configuration changed. \
On a segmented OT network the configuration of a switch or a controller is the \
segmentation and the process itself; an unplanned change is either an \
unauthorized modification or a misconfiguration that quietly weakens both. \
 \
Operates on the normalized SNMP contract (docs/TELEMETRY.md).
search = event_type="config_change" \
| table device,oid,snmp_value
