# Real engines for the parity harness. See README.md in this directory.
services:
  splunk:
    image: splunk/splunk@sha256:e26840dfe69ec9ff305c10681664900168849c3ff346a9cf49322b5351841f3f
    container_name: ot_splunk
    environment:
      SPLUNK_GENERAL_TERMS: --accept-sgt-current-at-splunk-com
      SPLUNK_START_ARGS: --accept-license
      SPLUNK_LICENSE_URI: Free
      SPLUNK_PASSWORD: ${SPLUNK_PASSWORD:-otde-parity-2026}
      SPLUNK_HEC_TOKEN: ${SPLUNK_HEC_TOKEN:-otde-parity-hec}
    ports:
      - "127.0.0.1:18000:8000"
      - "127.0.0.1:18088:8088"
      - "127.0.0.1:18089:8089"
    volumes:
      - splunk-var:/opt/splunk/var
      - splunk-etc:/opt/splunk/etc
    restart: unless-stopped

  opensearch:
    image: opensearchproject/opensearch@sha256:02358b2be62b268a404a54581184d027ac0dfa8f875be15fe4c4fa3f8884f464
    container_name: otde-opensearch
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: -Xms1g -Xmx1g
    ports:
      - "127.0.0.1:19200:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    ulimits:
      memlock:
        soft: -1
        hard: -1
    restart: unless-stopped

volumes:
  splunk-var:
  splunk-etc:
  opensearch-data:
