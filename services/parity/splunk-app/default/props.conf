# The parity corpus is newline-delimited JSON sent to HEC with this sourcetype.
# Search-time JSON extraction keeps one typed value per field. Indexed
# extraction plus the default AUTO_KV_JSON produced each field twice, and a
# multivalue field cannot satisfy a numeric comparison such as bytes>=5000000.
[ot:telemetry]
KV_MODE = json
AUTO_KV_JSON = false
TIME_PREFIX = "timestamp":\s*"
TIME_FORMAT = %Y-%m-%dT%H:%M:%SZ
MAX_TIMESTAMP_LOOKAHEAD = 64
SHOULD_LINEMERGE = false
