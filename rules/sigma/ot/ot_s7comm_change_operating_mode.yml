title: S7comm PLC Control Or Stop
id: d2003c38-34b8-4f8a-b8dc-409e1a5eeb23
status: experimental
description: |
  Detects a PLC Control or PLC Stop request. Both change the controller's
  operating mode and stop the running program, which is a direct availability
  and safety impact. Outside a maintenance window this is a strong indicator of
  a disruptive attack.

  Operates on decoded S7comm events (see docs/TELEMETRY.md) produced by
  tools/s7comm-dpi.
references:
  - https://attack.mitre.org/techniques/T0858/
author: Liam Carvajal
date: 2026-09-14
logsource:
  product: ot_ndr
  service: s7comm
detection:
  selection_direction:
    direction: request
  selection_function:
    function_code:
      - 40
      - 41
  condition: selection_direction and selection_function
fields:
  - function_name
  - rosctr
falsepositives:
  - A planned controller stop during maintenance or a firmware update
level: high
tags:
  - attack.t0858
