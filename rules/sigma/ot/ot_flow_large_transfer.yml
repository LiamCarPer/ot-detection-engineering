title: Large Transfer Between OT Assets
id: 2e6c9b14-7a58-4d03-8f21-9b4d6e1c3a80
status: experimental
description: |
  Detects a flow carrying more data than normal OT polling or control traffic.
  Moving tooling or collected data laterally inside the plant produces a volume
  the control protocols do not generate, so a byte threshold is a usable
  first-order signal even without payload inspection.

  The threshold is site-specific. It is expressed against a single flow, so a
  slow exfiltration spread over many small flows will not trip it; pair it with
  the flow-volume baseline for that case.
references:
  - https://attack.mitre.org/techniques/T0867/
author: Liam Carvajal
date: 2026-11-04
logsource:
  product: ot_flow
  service: flow
detection:
  selection:
    bytes|gte: 5000000
  condition: selection
fields:
  - src_ip
  - dst_ip
  - bytes
  - packets
  - duration
falsepositives:
  - A scheduled backup or historian replication inside the plant
  - An engineering workstation copying a project archive
  - A firmware or patch distribution to many assets
level: medium
tags:
  - attack.t0867
