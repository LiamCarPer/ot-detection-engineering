cases:
  - name: an enterprise host sends a DNP3 request with an authorized link address
    expect: match
    event:
      product: ot_ndr
      service: dnp3
      timestamp: "2026-11-05T09:03:00Z"
      direction: request
      function_code: 1
      src_ip: 172.24.0.10
      dst_ip: 172.31.0.10
      link_source: 1
      link_destination: 10

  - name: a second unapproved host polls an outstation
    expect: match
    event:
      product: ot_ndr
      service: dnp3
      timestamp: "2026-11-05T09:03:05Z"
      direction: request
      function_code: 20
      src_ip: 172.24.0.11
      dst_ip: 172.31.0.11
      link_source: 2
      link_destination: 11

  - name: the approved operations master polls
    expect: no_match
    event:
      product: ot_ndr
      service: dnp3
      timestamp: "2026-11-05T09:03:10Z"
      direction: request
      function_code: 1
      src_ip: 172.21.0.20
      dst_ip: 172.31.0.10
      link_source: 2
      link_destination: 10

  - name: an outstation response from an unknown host is not a master request
    expect: no_match
    event:
      product: ot_ndr
      service: dnp3
      timestamp: "2026-11-05T09:03:15Z"
      direction: response
      function_code: 129
      src_ip: 172.24.0.10
      dst_ip: 172.31.0.10
      link_source: 10
      link_destination: 1

  - name: a link-frame decoder without a transport address cannot attribute the master
    expect: no_match
    event:
      product: ot_ndr
      service: dnp3
      timestamp: "2026-11-05T09:03:20Z"
      direction: request
      function_code: 1
      link_source: 1
      link_destination: 10
