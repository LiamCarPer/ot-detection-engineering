title: OPC UA Method Call Request
id: a75c42a5-baf9-4c3b-8171-35eaaf58e4ec
status: experimental
description: |
  Detects an OPC UA CallRequest, which invokes a method on the server. Methods
  can start processes, change configuration or run vendor routines, so a call
  from an unexpected client is execution through the OPC UA API.

  Operates on decoded OPC UA events (see docs/TELEMETRY.md) produced by
  tools/opcua-dpi. Only plaintext (None/Sign) channels expose the service, so
  this rule does not see SignAndEncrypt traffic.
references:
  - https://attack.mitre.org/techniques/T0871/
author: Liam Carvajal
date: 2026-09-14
logsource:
  product: ot_ndr
  service: opcua
detection:
  selection_direction:
    direction: request
  selection_service:
    opcua_service: CallRequest
  condition: selection_direction and selection_service
fields:
  - secure_channel_id
  - request_id
  - service_id
falsepositives:
  - An authorized OPC UA client invoking a legitimate method
level: high
tags:
  - attack.t0871
