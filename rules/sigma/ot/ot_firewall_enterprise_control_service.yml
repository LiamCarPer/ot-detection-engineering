title: Enterprise Host Permitted To Reach A Control Zone Service
id: 5733a795-2920-4af1-b06b-f0af81267da6
status: experimental
description: |
  Detects the zone firewall accepting a connection from the enterprise zone to a
  control-zone industrial service port. Purdue segmentation allows no direct path
  from Level 4/5 to Level 1, so an accepted flow is a policy gap that lets an
  enterprise host reach a controller, outstation or OPC UA server directly and
  attempt to exploit the service instead of pivoting through the DMZ.

  The complementary rule detects the drop of the same traffic; this one fires
  when the path is allowed, which is the case worth fixing.
references:
  - https://attack.mitre.org/techniques/T0866/
author: Liam Carvajal
date: 2026-09-15
logsource:
  product: ot_firewall
  service: iptables
detection:
  selection_action:
    action: ACCEPT
  selection_route:
    src_zone: it
    dst_zone: control
  selection_service:
    dst_port:
      - 102
      - 502
      - 4840
      - 20000
  condition: selection_action and selection_route and selection_service
fields:
  - src_ip
  - dst_ip
  - dst_port
  - proto
falsepositives:
  - A time-boxed, documented maintenance path from the enterprise to a controller
level: critical
tags:
  - attack.t0866
