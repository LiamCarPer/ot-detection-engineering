# Correlation fixture: a window of events, and whether the correlation fires.
#
# The single-event sidecars use `cases`; a correlation needs a sequence and a
# timespan, so this sidecar uses `windows`. Every event must satisfy the
# referenced rule, or it is filtered out before the count is taken.
windows:
  - name: one host reads three distinct control assets inside the window
    expect: match
    events:
      - timestamp: "2026-05-01T10:27:07.700Z"
        product: ot_ndr
        service: modbus
        direction: request
        function_code: 3
        src_ip: 172.24.0.10
        dst_ip: 172.21.0.10
        unit_id: 1
        register: 0
      - timestamp: "2026-05-01T10:27:14.000Z"
        product: ot_ndr
        service: modbus
        direction: request
        function_code: 3
        src_ip: 172.24.0.10
        dst_ip: 172.21.0.11
        unit_id: 1
        register: 0
      - timestamp: "2026-05-01T10:27:21.300Z"
        product: ot_ndr
        service: modbus
        direction: request
        function_code: 3
        src_ip: 172.24.0.10
        dst_ip: 172.21.0.12
        unit_id: 1
        register: 0

  - name: one host polls a single asset repeatedly
