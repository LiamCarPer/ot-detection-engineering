cases:
  - name: a failed HMI login
    expect: match
    event:
      timestamp: "2026-09-15T16:24:35Z"
      product: ot_auth
      service: hmi
      event_type: login_failure
      src_ip: 172.24.0.30
      request: POST /Scada-LTS/login.htm HTTP/1.1
      status: 302

  - name: a successful HMI login
    expect: no_match
    event:
      timestamp: "2026-09-15T16:24:40Z"
      product: ot_auth
      service: hmi
      event_type: login_success
      src_ip: 172.24.0.30
      request: POST /Scada-LTS/login.htm HTTP/1.1
      status: 302
