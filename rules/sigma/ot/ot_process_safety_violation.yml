title: Process Safety Violation From Physics-Aware Monitor
id: 2569c23f-8db1-428e-b708-251d73855980
status: experimental
description: |
  Detects a command that is protocol-valid and issued from an authorized
  writer, but that violates the physical safety envelope of the process, for
  example opening an inlet valve while the tank is full. IP allowlisting and
  protocol validation cannot catch this class of event because every individual
  field is legitimate.

  The physics-aware monitor maintains a shadow of the process state and emits a
  structured violation event; this rule classifies it, assigns severity and
  routes it for response. It is the safety-layer counterpart to the protocol
  detections in this repository.
references:
  - https://attack.mitre.org/techniques/T0831/
author: Liam Carvajal
date: 2026-09-13
logsource:
  product: ot_process
  service: safety_monitor
detection:
  selection_event:
    event_type: process_safety_violation
  selection_unmitigated:
    response: none
  condition: selection_event and selection_unmitigated
fields:
  - asset
  - register
  - value
  - tank_level_pct
  - actor
falsepositives:
  - A deliberate process override performed during a documented emergency
level: critical
tags:
  - attack.t0831
