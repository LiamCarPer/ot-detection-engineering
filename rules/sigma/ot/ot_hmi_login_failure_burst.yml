title: HMI Login Failure Burst From One Source
id: 2d7f0b5c-8e63-4a94-8c21-6f3b9d1e5a72
status: experimental
description: |
  Detects three or more failed HMI logins from one source inside five minutes.
  The first-order rule records each failure; this correlation is the credential
  attack, and grouping by source keeps unrelated users apart.

  The T0859 tag is a coverage annotation, not a claim that valid accounts were
  used: ATT&CK for ICS has no dedicated authentication brute-force technique, and
  Valid Accounts is the closest technique this sequence precedes. If the
  enterprise ATT&CK matrix is in use, T1110 is the more precise tag. See
  docs/ATTACK_MAPPING.md.
references:
  - https://attack.mitre.org/techniques/T0859/
  - https://attack.mitre.org/techniques/T1110/
author: Liam Carvajal
date: 2026-11-25
correlation:
  generate: true
  type: event_count
  rules:
    - 1c6e9a4b-7d52-4f83-9b10-5e2a8c7f4d61
  group-by:
    - src_ip
  timespan: 5m
  condition:
    gte: 3
fields:
  - src_ip
falsepositives:
  - A user repeatedly mistyping a password
  - A password manager or SSO retry loop
level: medium
tags:
  - attack.t0859
