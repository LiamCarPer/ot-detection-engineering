windows:
  - name: a Modbus-only PLC receives an S7comm request
    expect: match
    events:
      - timestamp: "2026-12-01T08:00:00Z"
        product: ot_ndr
        service: s7comm
        direction: request
        src_ip: 172.24.0.10
        dst_ip: 172.21.0.10
        function_code: 26

  - name: a Modbus PLC receives a function code it never used
    expect: match
    events:
      - timestamp: "2026-12-01T08:01:00Z"
        product: ot_ndr
        service: modbus
        direction: request
        src_ip: 172.24.0.10
        dst_ip: 172.21.0.10
        function_code: 43

  - name: the normal Modbus read
    expect: no_match
    events:
      - timestamp: "2026-12-01T08:02:00Z"
        product: ot_ndr
        service: modbus
        direction: request
        src_ip: 172.22.0.10
        dst_ip: 172.21.0.10
        function_code: 3

  - name: the normal DNP3 request to the outstation
    expect: no_match
    events:
      - timestamp: "2026-12-01T08:03:00Z"
        product: ot_ndr
        service: dnp3
        direction: request
        src_ip: 172.22.0.10
        dst_ip: 172.21.0.50
        function_code: 1

  - name: an unknown asset is the new-asset rule's job
    expect: no_match
    events:
      - timestamp: "2026-12-01T08:04:00Z"
        product: ot_ndr
        service: modbus
        direction: request
        src_ip: 172.24.0.10
        dst_ip: 172.21.0.99
        function_code: 6
