cases:
  - name: SSH from the EWS to a PLC instead of the declared deployment API
    expect: match
    event: { src_ip: 172.23.0.4, dst_ip: 172.21.0.10, dst_port: 22 }

  - name: the insider polls DNP3 on its declared conduit
    expect: no_match
    event: { src_ip: 172.23.0.20, dst_ip: 172.21.0.50, dst_port: 20000 }

  - name: an undeclared path is a path violation, not a service one
    expect: no_match
    event: { src_ip: 172.24.0.10, dst_ip: 172.21.0.10, dst_port: 22 }

  - name: two hosts inside the control zone
    expect: no_match
    event: { src_ip: 172.21.0.10, dst_ip: 172.21.0.11, dst_port: 22 }
