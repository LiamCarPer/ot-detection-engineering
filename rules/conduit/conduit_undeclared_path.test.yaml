cases:
  - name: an enterprise host reaches a control-zone PLC
    expect: match
    event: { src_ip: 172.24.0.10, dst_ip: 172.21.0.10, dst_port: 502 }

  - name: an enterprise host reaches a control-zone outstation
    expect: match
    event: { src_ip: 172.24.0.10, dst_ip: 172.21.0.50, dst_port: 20000 }

  - name: the insider master reaches the outstation over the declared DNP3 conduit
    expect: no_match
    event: { src_ip: 172.23.0.20, dst_ip: 172.21.0.50, dst_port: 20000 }

  - name: the HMI reaches a PLC over the declared supervisory-to-control conduit
    expect: no_match
    event: { src_ip: 172.22.0.10, dst_ip: 172.21.0.10, dst_port: 502 }

  - name: two hosts inside the control zone
    expect: no_match
    event: { src_ip: 172.21.0.10, dst_ip: 172.21.0.11, dst_port: 502 }

  - name: a destination outside every declared zone
    expect: no_match
    event: { src_ip: 172.24.0.10, dst_ip: 8.8.8.8, dst_port: 443 }
