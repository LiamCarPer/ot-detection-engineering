name: Water treatment OT emulation
version: 2
description: |
  Adversary emulation plan for the OT-Security-Lab water treatment range. Each
  step is a real adversary action executed inside the lab, paired with the
  ground-truth alerts the lab emits and the repository rule that should detect
  it.

  Version 2 covers eight steps and fourteen expectations across the enterprise
  pivot, process safety, DNP3, OPC UA, S7comm and a PowerShell operator write.
  The lab also emits HMI-login, C2-beacon and OT-port-scan alerts; those are
  lab-only detections with no matching repository rule and are intentionally not
  scored here.

steps:
  - id: enterprise-cross-zone
    name: Enterprise host reaches the control zone
    technique: T0886
    description: |
      An enterprise-zone host attempts to reach a control-zone PLC directly.
      The zone firewall drops the flow and the lab emits a cross-zone alert.
    execute:
      command: docker exec ot_attacker python3 /attacker/simulate_attack.py
    expectations:
      - signal: CROSS_ZONE_VIOLATION
        technique: T0886
        lab_technique: T0886
        rule: rules/sigma/ot/ot_firewall_cross_zone_violation.yml

  - id: enterprise-modbus-write
    name: Enterprise host writes a Modbus register
    technique: T1692.001
    description: |
      The same enterprise host issues an unauthorized Modbus write to a PLC.
      The lab labels the alert by its impact (manipulation of control); the rule
      is mapped to the command-message technique. Both are recorded.
    execute:
      command: docker exec ot_attacker python3 /attacker/simulate_attack.py
    expectations:
      - signal: UNAUTHORIZED_MODBUS_WRITE
        technique: T1692.001
        lab_technique: T0831
        rule: rules/sigma/ot/ot_modbus_unauthorized_write.yml

  - id: enterprise-brute-force
    name: Modbus exception burst
    technique: T0806
    description: |
      The attacker floods invalid Modbus function codes until the controller
      returns a burst of exception responses. The lab treats the burst as
      reconnaissance; the native rule is mapped to Brute Force.
    execute:
      command: docker exec ot_attacker python3 /attacker/simulate_attack.py
    expectations:
      - signal: OT_BRUTE_FORCE_SCAN
        technique: T0806
        lab_technique: T0846
        rule: rules/native/suricata/modbus_dpi.rules

  - id: process-safety-violation
    name: Unsafe command while the process is in a danger state
    technique: T0831
    description: |
      The process state is driven to a high tank level, then a protocol-valid
      write from the authorized HMI opens the inlet valve. Every field is
      legitimate, so only the physics-aware monitor catches it.
    execute:
      command: docker exec ot_attacker python3 /attacker/simulate_process_violation.py
    expectations:
      - signal: PROCESS_SAFETY_VIOLATION
        technique: T0831
        lab_technique: T0836
        rule: rules/sigma/ot/ot_process_safety_violation.yml

  - id: dnp3-control-campaign
    name: DNP3 control, restart and unsolicited-response changes
    technique: T1692.001
    description: |
      A compromised insider issues DNP3 control operations, requests a cold or
      warm restart, and disables unsolicited responses. One action, three
      expected detections.
    execute:
      command: docker exec ot_insider python3 /attacker/simulate_dnp3_attack.py
    expectations:
      - signal: DNP3_UNAUTHORIZED_CONTROL
        technique: T1692.001
        lab_technique: T1692.001
        rule: rules/sigma/ot/ot_dnp3_unauthorized_control.yml
      - signal: DNP3_RESTART_COMMAND
        technique: T0816
        lab_technique: T0816
        rule: rules/sigma/ot/ot_dnp3_restart_command.yml
      - signal: DNP3_UNSOLICITED_DISABLED
        technique: T0878
        lab_technique: T0878
        rule: rules/sigma/ot/ot_dnp3_unsolicited_disabled.yml

  - id: opcua-discovery-campaign
    name: OPC UA browse, write and method call
    technique: T0888
    description: |
      The insider enumerates an OPC UA server, writes a node and invokes a
      method. The step exercises discovery, manipulation and execution on the
      same session.
    execute:
      command: docker exec ot_insider python3 /attacker/simulate_opcua_attack.py
    expectations:
      - signal: OPCUA_BROWSE_REQUEST
        technique: T0888
        lab_technique: T0888
        rule: rules/sigma/ot/ot_opcua_browse_request.yml
      - signal: OPCUA_WRITE_REQUEST
        technique: T1692.001
        lab_technique: T1692.001
        rule: rules/sigma/ot/ot_opcua_write_request.yml
      - signal: OPCUA_METHOD_CALL
        technique: T0871
        lab_technique: T0871
        rule: rules/sigma/ot/ot_opcua_method_call.yml

  - id: s7-program-campaign
    name: S7comm program download, upload and mode change
    technique: T0843
    description: |
      The insider downloads a program block, reads blocks back, and changes the
      controller's operating mode. This is persistence and collection on the
      PLC itself.
    execute:
      command: docker exec ot_insider python3 /attacker/simulate_s7comm_attack.py
    expectations:
      - signal: S7COMM_PROGRAM_DOWNLOAD
        technique: T0843
        lab_technique: T0843
        rule: rules/sigma/ot/ot_s7comm_program_download.yml
      - signal: S7COMM_PROGRAM_UPLOAD
        technique: T0845
        lab_technique: T0845
        rule: rules/sigma/ot/ot_s7comm_program_upload.yml
      - signal: S7COMM_CHANGE_OPERATING_MODE
        technique: T0858
        lab_technique: T0858
        rule: rules/sigma/ot/ot_s7comm_change_operating_mode.yml

  - id: operator-workstation-write
    name: PowerShell Modbus write from the operator workstation
    technique: T1692.001
    description: |
      The lab's operator workstation uses a PowerShell Modbus client to write a
      register. The source is different from the enterprise host, so this step
      proves the rule is not suppressing by alert type alone.
    execute:
      command: >-
        docker exec ot_powershell pwsh -NoProfile
        -File /opt/otsec/Invoke-OTAdversaryEmulation.ps1
        -Scenario UnauthorizedWrite -Target 172.21.0.10 -Register 1
        -TestValue 42 -AllowLab
    expectations:
      - signal: UNAUTHORIZED_MODBUS_WRITE
        technique: T1692.001
        lab_technique: T0831
        rule: rules/sigma/ot/ot_modbus_unauthorized_write.yml
