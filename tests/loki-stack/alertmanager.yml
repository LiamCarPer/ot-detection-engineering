# Alertmanager routes Loki ruler alerts to the in-network webhook receiver.
route:
  receiver: ot-detection
  group_by: ["alertname"]
  group_wait: 1s
  group_interval: 5s
  repeat_interval: 1h

receivers:
  - name: ot-detection
    webhook_configs:
      - url: http://webhook:8000/alerts
        send_resolved: false
