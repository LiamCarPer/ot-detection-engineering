version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies, security]
  - package-ecosystem: cargo
    directory: "/tools"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies, security]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies, security]
