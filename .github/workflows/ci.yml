name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  detection-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install toolchain
        run: pip install -r requirements.txt

      - name: Set up Rust
        # Pinned to match rust-toolchain.toml; keep the two in step.
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy

      - name: Format-check, lint and test the protocol decoders
        working-directory: tools
        run: |
          cargo fmt --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace

      - name: Lint
        run: ruff check .

      - name: Validate Sigma rules
        run: sigma check -x attacktag rules/sigma

      - name: Test rules and tooling
        run: pytest

      - name: Prove decoder output fires the Sigma rules
        run: python tools/decoder_check.py

      - name: Check the decoder evidence is current
        run: git diff --exit-code deploy/evidence/decoders/summary.json

      - name: Prove collector output fires the Sigma rules
        run: python tools/collector_check.py

      - name: Check the collector evidence is current
        run: git diff --exit-code deploy/evidence/collector/summary.json

      - name: Prove behaviour-baseline rules against committed telemetry
        run: python tools/baseline_check.py

      - name: Check the baseline evidence is current
        run: git diff --exit-code deploy/evidence/baseline/summary.json

      - name: Prove conduit rules against the declared segmentation policy
        run: python tools/conduit_check.py

      - name: Check the conduit evidence is current
        run: git diff --exit-code deploy/evidence/conduit/summary.json


      - name: Convert to Loki
        run: python pipelines/convert.py --backend loki --check

      - name: Convert to OpenSearch
        run: python pipelines/convert.py --backend opensearch --check

      - name: Convert to Splunk
        run: python pipelines/convert.py --backend splunk --check

      - name: Convert to Microsoft Sentinel (KQL)
        run: python pipelines/convert.py --backend sentinel --check

      - name: Check the deployment bundle is current
        run: python pipelines/deploy.py --check

      - name: Validate emulation plan
        run: python purple/runner/run_emulation.py --validate

      - name: Generate ATT&CK for ICS coverage map
        run: python coverage/generate_coverage.py

      - name: Compute detection metrics
        run: |
          python purple/runner/run_emulation.py \
            --observations purple/emulation/lab-observations.json
          python metrics/compute.py

      - name: Upload coverage map and metrics
        uses: actions/upload-artifact@v4
        with:
          name: detection-report
          path: |
            coverage/out/
            metrics/out/
