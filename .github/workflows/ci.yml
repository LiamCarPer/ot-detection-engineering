name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  detection-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install toolchain
        run: pip install -r requirements.txt

      - name: Set up Rust
        # Pinned to match rust-toolchain.toml; keep the two in step.
        uses: dtolnay/rust-toolchain@5059963b1731bf1580991b5f3b1eecfb5da406c0  # 1.98.0
        with:
          components: rustfmt, clippy

      - name: Format-check, lint and test the protocol decoders
        working-directory: tools
        run: |
          cargo fmt --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace

      - name: Lint
        run: ruff check .

      - name: Validate Sigma rules
        run: sigma check -x attacktag rules/sigma

      - name: Test rules and tooling
        run: pytest

      - name: Prove decoder output fires the Sigma rules
        run: python tools/decoder_check.py --check

      - name: Check the decoder evidence is current
        run: git diff --exit-code deploy/evidence/decoders/summary.json

      - name: Prove collector output fires the Sigma rules
        run: python tools/collector_check.py --check

      - name: Check the collector evidence is current
        run: git diff --exit-code deploy/evidence/collector/summary.json

      - name: Prove behaviour-baseline rules against committed telemetry
        run: python tools/baseline_check.py --check

      - name: Check the baseline evidence is current
        run: git diff --exit-code deploy/evidence/baseline/summary.json

      - name: Prove conduit rules against the declared segmentation policy
        run: python tools/conduit_check.py --check

      - name: Check the conduit evidence is current
        run: git diff --exit-code deploy/evidence/conduit/summary.json

      - name: Prove YARA rules against committed artifacts
        run: python tools/yara_check.py --check

      - name: Check the YARA evidence is current
        run: git diff --exit-code deploy/evidence/yara/summary.json

      - name: Prove stateful detections and their baselines
        run: python tools/stateful_check.py --check

      - name: Check the stateful evidence is current
        run: git diff --exit-code deploy/evidence/stateful/summary.json

      - name: Validate the performance evidence
        run: python tools/perf_check.py --check

      - name: Recompute the all-family false-positive report
        run: python metrics/fpr.py --check

      - name: Check the detection catalogue
        run: python tools/detection_health.py --check

      - name: Check security, allowlist and process-model evidence
        run: |
          python tools/check_action_pins.py
          python coverage/security_coverage.py --check
          python tools/allowlists.py --check
          python tools/process_model_check.py --check

      - name: Age stable rules against the real date
        run: python tools/detection_health.py --today

      - name: Check the lab case study
        run: python analysis/lab_case_study.py --input analysis/data/lab-2026-11-24 --out analysis/out --check

      - name: Check the purple replay evidence
        run: >-
          python purple/runner/run_emulation.py
          --observations purple/emulation/lab-observations.json
          --out deploy/evidence/purple --check


      - name: Convert to Loki
        run: python pipelines/convert.py --backend loki --check

      - name: Convert to OpenSearch
        run: python pipelines/convert.py --backend opensearch --check

      - name: Convert to Splunk
        run: python pipelines/convert.py --backend splunk --check

      - name: Convert to Microsoft Sentinel (KQL)
        run: python pipelines/convert.py --backend sentinel --check

      - name: Check the deployment bundle is current
        run: python pipelines/deploy.py --check

      - name: Validate emulation plans
        run: |
          python purple/runner/run_emulation.py --validate
          python purple/runner/run_emulation.py \
            --plan purple/emulation/emulation-plan-2026-09-13.yaml --validate

      - name: Generate ATT&CK for ICS coverage map
        run: python coverage/generate_coverage.py

      - name: Compute detection metrics
        run: |
          python purple/runner/run_emulation.py \
            --plan purple/emulation/emulation-plan-2026-09-13.yaml \
            --observations purple/emulation/lab-observations-2026-09-13.json \
            --out purple/results
          python metrics/compute.py

      - name: Check generated metrics and coverage are current
        run: git diff --exit-code coverage/out metrics/out

      - name: Upload coverage map and metrics
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: detection-report
          path: |
            coverage/out/
            metrics/out/
