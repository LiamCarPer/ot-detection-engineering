name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  detection-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install toolchain
        run: pip install -r requirements.txt

      - name: Lint
        run: ruff check .

      - name: Validate Sigma rules
        run: sigma check -x attacktag rules/sigma

      - name: Test rules and tooling
        run: pytest

      - name: Convert to Loki
        run: python pipelines/convert.py --backend loki --check

      - name: Convert to OpenSearch
        run: python pipelines/convert.py --backend opensearch --check

      - name: Convert to Splunk
        run: python pipelines/convert.py --backend splunk --check

      - name: Convert to Microsoft Sentinel (KQL)
        run: python pipelines/convert.py --backend sentinel --check

      - name: Validate emulation plan
        run: python purple/runner/run_emulation.py --validate

      - name: Generate ATT&CK for ICS coverage map
        run: python coverage/generate_coverage.py

      - name: Compute detection metrics
        run: |
          python purple/runner/run_emulation.py \
            --observations purple/emulation/lab-observations.json
          python metrics/compute.py

      - name: Upload coverage map and metrics
        uses: actions/upload-artifact@v4
        with:
          name: detection-report
          path: |
            coverage/out/
            metrics/out/
