# Approved engineering-change windows.
#
# This is the policy the change-window stateful rule joins against. A write from
# an engineering workstation to a controller is approved only when a window
# matches the source, destination, service, time and scope. An emergency change
# should be added here with a short retroactive window and a reason, not
# suppressed.
#
# Timestamps are UTC. `scope.function_codes` and `scope.register_min/max` bound
# what the window approves: a write inside the time window but outside the
# declared scope is still outside the change. `change_id` is optional in the
# telemetry; when an event carries one it must match the window's ticket.
version: 1
windows:
  - id: CHG-2026-12-01-001
    ticket: CHG-2026-12-01-001
    starts: "2026-12-01T10:00:00Z"
    ends: "2026-12-01T12:00:00Z"
    timezone: UTC
    src_ip: 172.23.0.4
    dst_ip: 172.21.0.10
    service: modbus
    approved_by: OT Change Board
    reason: Engineering workstation setpoint and configuration change
    scope:
      function_codes: [6, 16]
      register_min: 1000
      register_max: 1100
  - id: CHG-2026-12-02-002
    ticket: CHG-2026-12-02-002
    starts: "2026-12-02T01:00:00Z"
    ends: "2026-12-02T02:00:00Z"
    timezone: UTC
    src_ip: 172.23.0.4
    dst_ip: 172.21.0.11
    service: s7comm
    approved_by: Controls Engineering
    reason: PLC logic update
    scope:
      function_codes: [26, 27, 28]
