version: 1
allowlists:
- name: dnp3_approved_masters
  purpose: The DNP3 master allowed to poll and operate the outstation without an out-of-policy
    alert. The lab's engineering client is the approved master; a second master is
    a rogue-master finding.
  members:
  - ip: 172.23.0.20
    role: insider_engineering_client
    zone: ops
    criticality: high
  used_by:
    sigma:
    - rules/sigma/ot/ot_dnp3_request_from_unapproved_master.yml (filter_approved_master)
    native:
    - rules/native/suricata/dnp3_dpi.rules (sid:9000005)
    - rules/native/suricata/dnp3_dpi.rules (sid:9000006)
- name: modbus_approved_block_readers
  purpose: 'Hosts allowed to issue large block reads. The HMI and the L2 historian
    collector poll the controllers; any other reader is enumeration. The sensor gateway
    is deliberately not in this set: it polls one register.'
  members:
  - ip: 172.22.0.10
    role: hmi
    zone: supervisory
    criticality: high
  - ip: 172.22.0.20
    role: historian_collector
    zone: supervisory
    criticality: medium
  used_by:
    sigma:
    - rules/sigma/ot/ot_modbus_block_read.yml (filter_authorized_reader)
    native: []
- name: modbus_approved_process_readers
  purpose: Hosts allowed to read process state. The HMI and historian poll the controllers;
    the gateway reads HR5 for the process-level shadow.
  members:
  - ip: 172.21.0.2
    role: sensor_gateway
    zone: control
    criticality: critical
  - ip: 172.22.0.10
    role: hmi
    zone: supervisory
    criticality: high
  - ip: 172.22.0.20
    role: historian_collector
    zone: supervisory
    criticality: medium
  used_by:
    sigma:
    - rules/sigma/ot/ot_modbus_process_state_read.yml (filter_authorized_reader)
    native: []
- name: modbus_approved_writers
  purpose: Hosts allowed to write Modbus registers and coils. The operator HMI is
    the only standing writer; engineering changes use the change calendar.
  members:
  - ip: 172.22.0.10
    role: hmi
    zone: supervisory
    criticality: high
  used_by:
    sigma:
    - rules/sigma/ot/ot_modbus_coil_write.yml (filter_authorized_writer)
    - rules/sigma/ot/ot_modbus_unauthorized_write.yml (filter_authorized_writer)
    native:
    - rules/native/suricata/modbus_dpi.rules (sid:9000001)
    - rules/native/suricata/modbus_dpi.rules (sid:9000002)
- name: opcua_approved_connectors
  purpose: 'Clients allowed to open an OPC UA secure channel. This is the connection
    allowlist, not a write allowlist: the engineering client may connect, but a write
    from it still alerts.'
  members:
  - ip: 172.23.0.20
    role: insider_engineering_client
    zone: ops
    criticality: high
  used_by:
    sigma: []
    native:
    - rules/native/suricata/opcua_dpi.rules (sid:9000008)
    - rules/native/suricata/opcua_dpi.rules (sid:9000009)
- name: opcua_approved_writers
  purpose: Clients allowed to write node values over OPC UA. The HMI and the EWS are
    the interactive clients; the engineering client's OPC UA use is the malicious-insider
    path this detection exists to catch.
  members:
  - ip: 172.22.0.10
    role: hmi
    zone: supervisory
    criticality: high
  - ip: 172.23.0.4
    role: ews
    zone: ops
    criticality: high
  used_by:
    sigma:
