# Security control register. Each control maps to the threats it mitigates and
# to the thing that proves it exists. The governance test refuses an orphaned
# threat, a control with no threat, a duplicate id, or an implemented control
# whose evidence path is missing.
version: 1
controls:
  - id: C-001
    title: Bounds-checked, panic-resistant protocol decoders
    threats: [T-001, T-002]
    status: implemented
    verify: make rust
    evidence: tools/dnp3-dpi/tests/robustness.rs
